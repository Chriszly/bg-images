      <polyline points="198,90 150,95 85,140 62,185 40,215 80,228 70,250 120,270 160,310 198,345"/>
      <!-- forehead -->
      <path d="M198,90 L170,130 M150,95 L170,130 M170,130 L198,150 M170,130 L120,150 M150,95 L120,150 M138,100 L120,150 M96,122 L120,150 M85,140 L120,150"/>
