      <!-- cheek / white fur line -->
      <path d="M62,185 L98,190 M120,150 L98,190 M85,140 L98,190 M40,215 L98,190 M98,190 L140,185 M98,190 L80,228 M98,190 L130,230 M157,193 L130,230 M140,185 L130,230"/>
      <!-- snout -->
      <path d="M175,188 L180,250 M175,188 L198,215 M198,215 L180,250 M130,230 L180,250 M130,230 L120,270 M80,228 L130,230 M70,250 L130,230 M120,270 L170,290 M180,250 L170,290 M170,290 L160,310 M180,250 L198,262 M198,262 L170,290"/>
      <!-- nose -->
